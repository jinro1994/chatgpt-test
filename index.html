<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>ChatGPT × GitHub Test</title>
  <style>
    :root {
      color-scheme: light dark;
      --bg: #0b1020;
      --card: rgba(255,255,255,.08);
      --text: #f4f7fb;
      --muted: #b8c0cf;
      --accent: #7dd3fc;
      --accent2: #c084fc;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background:
        radial-gradient(circle at 20% 20%, rgba(125,211,252,.18), transparent 35%),
        radial-gradient(circle at 80% 30%, rgba(192,132,252,.18), transparent 35%),
        var(--bg);
      color: var(--text);
      padding: 24px;
    }
    .card {
      width: min(720px, 100%);
      padding: 40px;
      border: 1px solid rgba(255,255,255,.14);
      border-radius: 24px;
      background: var(--card);
      backdrop-filter: blur(14px);
      box-shadow: 0 24px 80px rgba(0,0,0,.35);
    }
    .badge {
      display: inline-block;
      padding: 6px 10px;
      border-radius: 999px;
      background: rgba(125,211,252,.12);
      border: 1px solid rgba(125,211,252,.28);
      color: var(--accent);
      font-size: 14px;
    }
    h1 {
      margin: 18px 0 12px;
      font-size: clamp(34px, 7vw, 64px);
      line-height: 1;
      letter-spacing: -.04em;
    }
    p {
      color: var(--muted);
      font-size: 18px;
      line-height: 1.7;
    }
    button {
      margin-top: 16px;
      border: 0;
      border-radius: 14px;
      padding: 12px 18px;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      color: #0b1020;
    }
    #message {
      margin-top: 18px;
      min-height: 28px;
      color: var(--text);
      font-weight: 700;
    }
    .meta {
      margin-top: 28px;
      padding-top: 20px;
      border-top: 1px solid rgba(255,255,255,.12);
      font-size: 14px;
      color: var(--muted);
    }
  </style>
</head>
<body>
  <main class="card">
    <span class="badge">GitHub連携テスト成功</span>
    <h1>ChatGPT × GitHub</h1>
    <p>
      このページは、ChatGPTから直接GitHubリポジトリへ作成しました。
      コードの作成・更新・確認まで、チャットから操作できます。
    </p>
    <button id="testButton">動作テスト</button>
    <div id="message" aria-live="polite"></div>
    <div class="meta">Repository: jinro1994/chatgpt-test</div>
  </main>

  <script>
    const button = document.getElementById('testButton');
    const message = document.getElementById('message');

    button.addEventListener('click', () => {
      const now = new Date().toLocaleString('ja-JP');
      message.textContent = 'JavaScriptも正常に動いています。 ' + now;
    });
  </script>
</body>
</html>
